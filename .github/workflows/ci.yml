name: CI

on:
  push:
    branches:
      - "**"
      - "!release-please--**"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: nix develop --command node scripts/check-pr-title.mjs
      - name: Locked dependencies
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Formatting, lint, types, unit tests, and build
        run: nix develop --command pnpm check
      - name: Browser integration tests
        run: nix develop --command pnpm test:e2e
      - name: Dependency audit
        run: nix develop --command pnpm audit --audit-level=high
      - name: Nix and treefmt checks
        run: nix flake check
